name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Emacs
        run: sudo apt-get update && sudo apt-get install -y emacs-nox
      - name: Build site
        run: |
          emacs --batch \
            --eval "(progn (require 'package) \
              (add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\")) \
              (package-initialize) \
              (unless (package-installed-p 'htmlize) \
                (package-refresh-contents) (package-install 'htmlize)))" \
            -l publish.el --eval "(org-publish-all t)"
          cp static/style.css public/style.css   # mirror the `just run` recipe
          touch public/.nojekyll                  # serve files as-is, no Jekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
